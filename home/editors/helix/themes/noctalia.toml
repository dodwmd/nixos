# Noctalia-default palette, matching home/terminal/emulators/foot-noctalia-theme
# (a static stand-in for noctalia-shell's runtime-generated theme, which is
# disabled — see home/services/wayland/noctalia.nix).

"attribute" = "blue"
"type" = "blue"
"type.builtin" = "blue"
"constructor" = "pink"
"constant" = "yellow"
"constant.builtin" = "pink"
"constant.character" = "mint"
"constant.character.escape" = "pink"
"constant.numeric" = "yellow"
"string" = "mint"
"string.regexp" = "pink"
"string.special" = "yellow"
"comment" = { fg = "comment", modifiers = ["italic"] }
"variable" = "text"
"variable.builtin" = "pink"
"variable.parameter" = "text"
"variable.other.member" = "blue"
"label" = "pink"
"punctuation" = "muted"
"punctuation.delimiter" = "muted"
"punctuation.bracket" = "muted"
"keyword" = "pink"
"keyword.directive" = "pink"
"operator" = "pink"
"function" = "blue"
"function.builtin" = "blue"
"function.macro" = "pink"
"tag" = "pink"
"namespace" = "blue"
"special" = "yellow"

"markup.heading" = { fg = "blue", modifiers = ["bold"] }
"markup.list" = "pink"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.link.url" = { fg = "blue", modifiers = ["underlined"] }
"markup.link.text" = "pink"
"markup.raw" = "mint"

"diff.plus" = "mint"
"diff.minus" = "pink"
"diff.delta" = "yellow"

"diagnostic" = { modifiers = ["underlined"] }
"error" = "pink"
"warning" = "yellow"
"info" = "blue"
"hint" = "mint"

"ui.background" = { fg = "text", bg = "background" }
"ui.text" = "text"
"ui.text.focus" = { fg = "text", modifiers = ["bold"] }
"ui.cursor" = { fg = "background", bg = "pink" }
"ui.cursor.primary" = { fg = "background", bg = "yellow" }
"ui.cursorline.primary" = { bg = "surface" }
"ui.selection" = { fg = "background", bg = "text" }
"ui.selection.primary" = { fg = "background", bg = "text" }
"ui.linenr" = { fg = "muted" }
"ui.linenr.selected" = { fg = "yellow" }
"ui.statusline" = { fg = "text", bg = "surface" }
"ui.statusline.inactive" = { fg = "muted", bg = "surface" }
"ui.statusline.normal" = { fg = "background", bg = "blue", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "background", bg = "mint", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "background", bg = "pink", modifiers = ["bold"] }
"ui.popup" = { fg = "text", bg = "surface" }
"ui.window" = { fg = "surface" }
"ui.help" = { fg = "text", bg = "surface" }
"ui.picker.header" = { modifiers = ["bold"] }
"ui.menu" = { fg = "text", bg = "surface" }
"ui.menu.selected" = { fg = "background", bg = "blue" }
"ui.bufferline" = { fg = "muted", bg = "surface" }
"ui.bufferline.active" = { fg = "background", bg = "blue" }
"ui.virtual.whitespace" = "muted"
"ui.virtual.ruler" = { bg = "surface" }
"ui.virtual.indent-guide" = "muted"

[palette]
background = "#070722"
text = "#f3edf7"
surface = "#11112d"
muted = "#21215f"
pink = "#fd4663"
mint = "#9bfece"
yellow = "#fff59b"
blue = "#a9aefe"
comment = "#6f6f9f"
